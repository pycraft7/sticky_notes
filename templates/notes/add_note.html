{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Note</title>

    <link
        rel="stylesheet"
        href="{% static 'notes/css/home.css' %}"
    >

</head>


<body>

<div class="form-page">

    <div class="form-card">

        <div class="form-header">

            <h1>
                Create Note
            </h1>

            <p>
                Write down your thoughts and ideas.
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Title
                </label>

                <input
                    type="text"
                    name="title"
                    placeholder="Enter note title"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Content
                </label>

                <textarea
                    name="content"
                    rows="9"
                    placeholder="Write your note..."
                    required
                ></textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{% url 'home_views' %}"
                    class="secondary-btn"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Note
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
